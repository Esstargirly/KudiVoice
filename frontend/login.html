<!DOCTYPE html>

<html class="light" lang="en"><head>

                        "on-surface": "#1b1c19",
                        "error-container": "#ffdad6",
                        "surface-container-highest": "#e4e2dd",
                        "tertiary": "#65573e",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#7f7055",

                        "on-tertiary": "#ffffff",

                        "inverse-on-surface": "#f2f1ec",
                        "on-secondary-container": "#275a81",
                        "surface-container-high": "#eae8e3",
                        "on-secondary-fixed-variant": "#114a70",
                        "primary-fixed-dim": "#9dd3aa",
                        "surface-container": "#f0eee9",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#f4e0c0",

<style>
        body {
            background-color: #fbf9f4;
            font-family: 'Public Sans', sans-serif;
            overflow-x: hidden;
        }
        .soft-shadow {
            box-shadow: 0 10px 40px -10px rgba(49, 99, 66, 0.08);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .interactive-scale:active {
            transform: scale(0.98);
        }
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<header class="bg-background dark:bg-background flex justify-between items-center w-full px-container-padding-mobile md:px-container-padding-desktop py-4 max-w-7xl mx-auto">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">diamond</span>
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">KudiVoice</span>
</div>
<!-- <a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">Help</a> -->
</header>
<main class="flex-grow flex items-center justify-center px-container-padding-mobile py-section-gap relative">
<div class="absolute top-1/4 left-10 w-64 h-64 bg-primary-fixed opacity-10 rounded-full blur-3xl -z-10"></div>
<div class="absolute bottom-1/4 right-10 w-96 h-96 bg-secondary-container opacity-10 rounded-full blur-3xl -z-10"></div>
<div class="w-full max-w-lg bg-surface-container-lowest p-8 md:p-12 rounded-xl soft-shadow">
<div class="text-center mb-10">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Your stress-free bookkeeping companion is ready.</p>
</div>

<!-- Error message banner (hidden by default) -->

<div id="login-error" class="hidden bg-error-container text-on-error-container rounded-xl px-5 py-3 mb-6 text-sm font-body-md"></div>

<form id="login-form" class="space-y-6">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border-none rounded-xl font-body-md text-body-md focus:ring-2 focus:ring-primary focus:bg-surface-container transition-all placeholder:text-outline-variant" id="email" name="email" placeholder="owner@business.com" type="email" required/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant block" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-surface-container-low border-none rounded-xl font-body-md text-body-md focus:ring-2 focus:ring-primary focus:bg-surface-container transition-all placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" type="password" required/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary" type="button" id="toggle-password">
<span class="material-symbols-outlined" id="toggle-password-icon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center gap-3 py-2">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-0 bg-surface-container-low" id="remember" type="checkbox"/>
<label class="font-label-md text-label-md text-on-surface-variant select-none" for="remember">Stay logged in for 30 days</label>
</div>
<button class="w-full bg-primary text-on-primary font-label-md text-headline-sm py-4 rounded-xl soft-shadow interactive-scale transition-all hover:bg-primary-container active:scale-95 flex items-center justify-center gap-2" type="submit" id="login-submit">
<span id="login-submit-text">Log In</span>
</button>
</form>

<div class="mt-10 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    New here? <a class="text-primary font-bold hover:underline" href="signup.html">Create an account</a>
</p>
</div>
</div>
</main>
<section class="w-full max-w-7xl mx-auto px-container-padding-mobile mb-10">
<div class="bg-secondary-container/20 rounded-3xl p-8 flex flex-col md:flex-row items-center justify-between gap-6 overflow-hidden relative">
<div class="md:w-1/2 z-10">
<h3 class="font-headline-sm text-headline-sm text-on-secondary-container mb-2">Secure &amp; Encrypted</h3>
<p class="font-body-md text-body-md text-on-secondary-container/80">Your financial data is protected with bank-level 256-bit encryption. KudiVoice never shares your private business records.</p>
</div>
<div class="md:w-1/3 h-40 relative">
<div class="absolute inset-0 bg-white/40 backdrop-blur-md rounded-2xl soft-shadow transform rotate-3"></div>
<div class="absolute inset-4 bg-white rounded-xl soft-shadow flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'FILL' 1;">verified_user</span>
</div>
</div>
</div>
</section>
<div class="fixed bottom-8 right-8 z-50">
<button class="w-14 h-14 bg-tertiary-container text-on-tertiary-container rounded-full soft-shadow flex items-center justify-center interactive-scale hover:bg-tertiary transition-all group">
<span class="material-symbols-outlined group-hover:rotate-12 transition-transform">support_agent</span>
</button>
</div>

<script src="js/api.js"></script>

<script src="js/auth.js"></script>

<script>
    // Password visibility toggle
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggle-password-icon');

    toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleIcon.innerText = isPassword ? 'visibility_off' : 'visibility';
    });

    // Micro-interaction for form focus
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('focus', () => {
            input.parentElement.classList.add('scale-[1.01]');
        });
        input.addEventListener('blur', () => {
            input.parentElement.classList.remove('scale-[1.01]');
        });
    });
</script>

</body></html>
