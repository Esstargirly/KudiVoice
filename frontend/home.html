<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>KudiVoice - Dashboard</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&amp;family=Quicksand:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed-dim": "#d7c4a5",
                    "secondary-fixed": "#cde5ff",
                    "on-primary-fixed": "#00210e",
                    "on-tertiary-fixed": "#241a06",
                    "secondary": "#316289",
                    "primary-container": "#4a7c59",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed": "#b9efc5",
                    "surface-dim": "#dbdad5",
                    "on-secondary": "#ffffff",
                    "outline-variant": "#c1c9bf",
                    "surface-tint": "#376847",
                    "inverse-primary": "#9dd3aa",
                    "on-primary-fixed-variant": "#1e5031",
                    "on-secondary-fixed": "#001d32",
                    "surface-variant": "#e4e2dd",
                    "surface": "#fbf9f4",
                    "on-surface": "#1b1c19",
                    "error-container": "#ffdad6",
                    "surface-container-highest": "#e4e2dd",
                    "tertiary": "#65573e",
                    "on-error-container": "#93000a",
                    "tertiary-container": "#7f7055",
                    "on-error": "#ffffff",
                    "outline": "#717971",
                    "error": "#ba1a1a",
                    "surface-bright": "#fbf9f4",
                    "primary": "#316342",
                    "on-tertiary-container": "#fff6ed",
                    "on-tertiary": "#ffffff",
                    "secondary-container": "#a2d1fd",
                    "on-background": "#1b1c19",
                    "background": "#fbf9f4",
                    "secondary-fixed-dim": "#9ccbf8",
                    "inverse-on-surface": "#f2f1ec",
                    "on-secondary-container": "#275a81",
                    "surface-container-high": "#eae8e3",
                    "on-secondary-fixed-variant": "#114a70",
                    "primary-fixed-dim": "#9dd3aa",
                    "surface-container": "#f0eee9",
                    "on-primary": "#ffffff",
                    "tertiary-fixed": "#f4e0c0",
                    "inverse-surface": "#30312e",
                    "on-surface-variant": "#414942",
                    "surface-container-low": "#f5f3ee",
                    "on-primary-container": "#e1ffe5",
                    "on-tertiary-fixed-variant": "#52452d"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-padding-desktop": "40px",
                    "unit": "8px",
                    "gutter": "24px",
                    "container-padding-mobile": "20px",
                    "section-gap": "64px"
            },
            "fontFamily": {
                    "label-sm": ["Public Sans"],
                    "headline-md": ["Quicksand"],
                    "label-md": ["Public Sans"],
                    "body-md": ["Public Sans"],
                    "headline-lg": ["Quicksand"],
                    "headline-sm": ["Quicksand"],
                    "headline-lg-mobile": ["Quicksand"],
                    "body-lg": ["Public Sans"]
            },
            "fontSize": {
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "headline-md": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-sm": ["22px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-lg-mobile": ["32px", {"lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fbf9f4;
            -webkit-tap-highlight-color: transparent;
        }
        .soft-shadow {
            box-shadow: 0 10px 40px -10px rgba(49, 99, 66, 0.08);
        }
        .mic-pulse {
            animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.3; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="font-body-md text-on-surface selection:bg-primary-fixed selection:text-on-primary-fixed">
<header class="sticky top-0 z-40 bg-surface/80 backdrop-blur-md">
<div class="flex items-center w-full px-container-padding-mobile md:px-container-padding-desktop py-6 max-w-7xl mx-auto">
<div class="flex items-center gap-4 flex-1">
<div class="w-12 h-12 rounded-full overflow-hidden bg-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-[24px]">storefront</span>
</div>
<div>
<h1 id="greeting" class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary">Hi there 👋</h1>
<p class="font-body-md text-on-surface-variant">Let's balance your books today.</p>
</div>
</div>
<button class="p-2 hover:bg-surface-container-high dark:hover:bg-surface-container-highest rounded-full transition-all">
<span class="material-symbols-outlined text-primary text-[28px]">notifications</span>
</button>
</div>
</header>
<main class="max-w-7xl mx-auto px-container-padding-mobile md:px-container-padding-desktop pb-32">
<!-- Entry Section -->
<section class="mt-8 space-y-6">
<div class="relative group">
<div class="bg-surface-container-low rounded-xl soft-shadow p-6 md:p-8 transition-all duration-300 group-focus-within:bg-white group-focus-within:ring-1 group-focus-within:ring-primary">
<label class="block font-label-md text-label-md text-on-surface-variant mb-4" for="journal-entry">New Record</label>
<textarea class="w-full bg-transparent border-none focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder:text-outline p-0 min-h-[160px] resize-none" id="journal-entry" placeholder="Tell me what happened today... e.g. Sold 20 bags of rice for 45,000, paid 10,000 for transport"></textarea>
<div class="flex items-center justify-between mt-6 pt-4 border-t border-outline-variant/30">
<div class="flex items-center gap-3">
<button class="relative w-14 h-14 bg-secondary-container text-on-secondary-container rounded-full flex items-center justify-center hover:scale-105 active:scale-95 transition-transform" id="mic-btn">
<span class="absolute inset-0 rounded-full bg-secondary-container mic-pulse opacity-50"></span>
<span class="material-symbols-outlined relative z-10 text-[28px]">mic</span>
</button>
<span class="font-label-sm text-label-sm text-on-surface-variant hidden md:block">Tap to speak entry</span>
</div>
<button id="add-entry-btn" class="bg-primary text-on-primary px-8 py-4 rounded-full font-label-md text-label-md shadow-lg shadow-primary/20 hover:bg-primary-container active:scale-95 transition-all">
                            Add Entry
                        </button>
</div>
</div>
</div>
</section>
<!-- AI Summary Card -->
<section class="mt-12">
<div class="bg-secondary-fixed/30 rounded-xl p-8 flex items-start gap-6 border border-secondary-fixed-dim/20 soft-shadow">
<div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center flex-shrink-0 shadow-sm">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">diamond</span>
</div>
<div class="space-y-1">
<h3 class="font-headline-sm text-headline-sm text-secondary">Quick Insight</h3>
<p id="insight-text" class="font-body-lg text-body-lg text-on-surface-variant">
                        Add your first record and I'll show you a quick insight here.
                    </p>
</div>
</div>
</section>
<!-- Recent Activity Header -->
<div class="mt-12 flex justify-between items-center">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Recent Records</h2>
<a href="records.html" class="font-label-md text-label-md text-primary hover:underline transition-all">See all</a>
</div>
<!-- Recent Items (populated by entry.js) -->
<div id="recent-records-list" class="mt-6 space-y-4">
<p class="text-on-surface-variant font-body-md text-center py-8">No records yet — add your first one above.</p>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-safe pt-3 bg-surface dark:bg-surface-container-lowest shadow-[0_-4px_30px_rgba(49,99,66,0.08)] rounded-t-xl">
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-2xl px-4 py-1.5 active:scale-95 duration-150" href="home.html">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1.5 hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors" href="records.html">
<span class="material-symbols-outlined">receipt_long</span>
<span class="font-label-sm text-label-sm">Records</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1.5 hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors" href="records.html">
<span class="material-symbols-outlined">analytics</span>
<span class="font-label-sm text-label-sm">Summary</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1.5 hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors" href="settings.html">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</a>
</nav>

<script src="js/api.js"></script>
<script src="js/entry.js?v=2"></script>
</body></html>
